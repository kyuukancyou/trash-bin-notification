<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゴミ箱満杯通知システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // アイコンコンポーネント
    const AlertCircle = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    );

    const CheckCircle = ({ className }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    );

    const Trash2 = ({ className }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );

    const Bell = ({ className }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    );

    const Settings = ({ className }) => (
      <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 1v6m0 6v6m7.07-14.93l-4.24 4.24m-5.66 5.66l-4.24 4.24m18.38-1.41l-6-2.12m-6.36-2.24l-6-2.12m18.38 7.41l-6 2.12m-6.36 2.24l-6 2.12"></path>
      </svg>
    );

    function TrashNotificationSystem() {
      const [notifications, setNotifications] = useState([]);
      const [showSuccess, setShowSuccess] = useState(false);
      const [trashBinId, setTrashBinId] = useState('ゴミ箱A');
      const [discordWebhook, setDiscordWebhook] = useState('');
      const [showSettings, setShowSettings] = useState(false);
      const [webhookSaved, setWebhookSaved] = useState(false);

      useEffect(() => {
        loadNotifications();
        loadWebhook();
      }, []);

      const loadNotifications = () => {
        try {
          const saved = localStorage.getItem('trash-notifications');
          if (saved) {
            setNotifications(JSON.parse(saved));
          }
        } catch (error) {
          console.log('通知データの読み込みエラー:', error);
        }
      };

      const loadWebhook = () => {
        try {
          const saved = localStorage.getItem('discord-webhook');
          if (saved) {
            setDiscordWebhook(saved);
            setWebhookSaved(true);
          }
        } catch (error) {
          console.log('Webhook読み込みエラー:', error);
        }
      };

      const saveWebhook = () => {
        try {
          localStorage.setItem('discord-webhook', discordWebhook);
          setWebhookSaved(true);
          alert('Discord Webhookを保存しました!');
        } catch (error) {
          alert('保存に失敗しました');
        }
      };

      const saveNotifications = (newNotifications) => {
        try {
          localStorage.setItem('trash-notifications', JSON.stringify(newNotifications));
        } catch (error) {
          console.error('保存エラー:', error);
        }
      };

      const sendDiscordNotification = async (binId) => {
        if (!discordWebhook) {
          console.log('Discord Webhook未設定');
          return;
        }

        try {
          const embed = {
            title: '🚨 ゴミ箱満杯の報告',
            description: `**${binId}** がいっぱいです!`,
            color: 15158332,
            fields: [
              {
                name: '報告時刻',
                value: new Date().toLocaleString('ja-JP'),
                inline: true
              },
              {
                name: 'ステータス',
                value: '未対応',
                inline: true
              }
            ],
            footer: {
              text: 'ゴミ箱管理システム'
            },
            timestamp: new Date().toISOString()
          };

          const response = await fetch(discordWebhook, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              content: '@everyone ゴミ箱の確認をお願いします!',
              embeds: [embed]
            })
          });

          if (!response.ok) {
            throw new Error('Discord通知送信失敗');
          }
          console.log('Discord通知送信成功');
        } catch (error) {
          console.error('Discord通知エラー:', error);
          alert('Discord通知の送信に失敗しました。Webhook URLを確認してください。');
        }
      };

      const handleReport = async () => {
        const newNotification = {
          id: Date.now(),
          binId: trashBinId,
          timestamp: new Date().toLocaleString('ja-JP'),
          status: 'reported'
        };

        const updatedNotifications = [newNotification, ...notifications];
        setNotifications(updatedNotifications);
        saveNotifications(updatedNotifications);

        await sendDiscordNotification(trashBinId);

        setShowSuccess(true);
        setTimeout(() => setShowSuccess(false), 3000);

        if ('vibrate' in navigator) {
          navigator.vibrate(200);
        }
      };

      const markAsResolved = (id) => {
        const updatedNotifications = notifications.map(notif =>
          notif.id === id ? { ...notif, status: 'resolved' } : notif
        );
        setNotifications(updatedNotifications);
        saveNotifications(updatedNotifications);
      };

      const deleteNotification = (id) => {
        const updatedNotifications = notifications.filter(notif => notif.id !== id);
        setNotifications(updatedNotifications);
        saveNotifications(updatedNotifications);
      };

      const unresolvedCount = notifications.filter(n => n.status === 'reported').length;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
          <div className="max-w-4xl mx-auto">
            <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="flex items-center gap-3">
                  <div className="bg-indigo-100 p-3 rounded-xl">
                    <Trash2 className="w-8 h-8 text-indigo-600" />
                  </div>
                  <div>
                    <h1 className="text-2xl font-bold text-gray-800">ゴミ箱管理システム</h1>
                    <p className="text-sm text-gray-500">Discord通知連携</p>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  {unresolvedCount > 0 && (
                    <div className="flex items-center gap-2 bg-red-100 text-red-700 px-4 py-2 rounded-full">
                      <Bell className="w-5 h-5" />
                      <span className="font-bold">{unresolvedCount}</span>
                    </div>
                  )}
                  <button
                    onClick={() => setShowSettings(!showSettings)}
                    className="bg-gray-100 p-3 rounded-xl hover:bg-gray-200 transition-colors"
                  >
                    <Settings className="w-6 h-6 text-gray-600" />
                  </button>
                </div>
              </div>

              {showSettings && (
                <div className="mt-6 pt-6 border-t-2 border-gray-100">
                  <h3 className="font-bold text-gray-800 mb-3">⚙️ Discord Webhook設定</h3>
                  <div className="space-y-3">
                    <input
                      type="text"
                      value={discordWebhook}
                      onChange={(e) => setDiscordWebhook(e.target.value)}
                      placeholder="https://discord.com/api/webhooks/..."
                      className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none text-sm"
                    />
                    <div className="flex gap-2 items-center">
                      <button
                        onClick={saveWebhook}
                        className="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors"
                      >
                        保存
                      </button>
                      {webhookSaved && (
                        <span className="flex items-center gap-2 text-green-600 font-semibold">
                          <CheckCircle className="w-5 h-5" />
                          設定済み
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="grid md:grid-cols-2 gap-6">
              <div className="bg-white rounded-2xl shadow-lg p-6">
                <div className="bg-yellow-50 border-2 border-yellow-200 rounded-xl p-4 mb-4">
                  <h2 className="text-lg font-bold text-yellow-800 mb-2">📱 利用者画面</h2>
                  <p className="text-sm text-yellow-700">QRコードをスキャンするとこの画面が表示されます</p>
                </div>

                <div className="text-center space-y-4">
                  <div className="bg-gradient-to-br from-orange-400 to-red-500 w-24 h-24 mx-auto rounded-2xl flex items-center justify-center shadow-lg">
                    <AlertCircle />
                  </div>

                  <h3 className="text-xl font-bold text-gray-800">ゴミ箱が満杯ですか?</h3>
                  
                  <select
                    value={trashBinId}
                    onChange={(e) => setTrashBinId(e.target.value)}
                    className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                  >
                    <option value="ゴミ箱A">ゴミ箱A (1階エントランス)</option>
                    <option value="ゴミ箱B">ゴミ箱B (2階廊下)</option>
                    <option value="ゴミ箱C">ゴミ箱C (3階休憩室)</option>
                  </select>

                  <button
                    onClick={handleReport}
                    className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 px-6 rounded-xl hover:from-indigo-700 hover:to-purple-700 transform hover:scale-105 transition-all shadow-lg"
                  >
                    満杯を報告する
                  </button>

                  {showSuccess && (
                    <div className="bg-green-50 border-2 border-green-300 rounded-xl p-4 flex items-center gap-3 animate-pulse">
                      <CheckCircle className="w-6 h-6 text-green-600" />
                      <span className="text-green-800 font-semibold">報告完了!Discordに通知しました</span>
                    </div>
                  )}
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-lg p-6">
                <div className="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-4 mb-4">
                  <h2 className="text-lg font-bold text-indigo-800 mb-2">🔔 管理者画面</h2>
                  <p className="text-sm text-indigo-700">報告をリアルタイムで受信</p>
                </div>

                <div className="space-y-3 max-h-96 overflow-y-auto">
                  {notifications.length === 0 ? (
                    <div className="text-center py-12 text-gray-400">
                      <Trash2 className="w-16 h-16 mx-auto mb-3 opacity-30" />
                      <p>まだ報告はありません</p>
                    </div>
                  ) : (
                    notifications.map((notif) => (
                      <div
                        key={notif.id}
                        className={`p-4 rounded-xl border-2 ${
                          notif.status === 'resolved'
                            ? 'bg-gray-50 border-gray-200'
                            : 'bg-red-50 border-red-300'
                        }`}
                      >
                        <div className="flex items-start justify-between mb-2">
                          <div>
                            <h4 className="font-bold text-gray-800">{notif.binId}</h4>
                            <p className="text-sm text-gray-500">{notif.timestamp}</p>
                          </div>
                          {notif.status === 'resolved' && (
                            <span className="bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1 rounded-full">
                              対応済み
                            </span>
                          )}
                        </div>
                        
                        {notif.status === 'reported' && (
                          <div className="flex gap-2">
                            <button
                              onClick={() => markAsResolved(notif.id)}
                              className="flex-1 bg-green-600 text-white text-sm font-semibold py-2 px-3 rounded-lg hover:bg-green-700 transition-colors"
                            >
                              対応完了
                            </button>
                            <button
                              onClick={() => deleteNotification(notif.id)}
                              className="bg-gray-300 text-gray-700 text-sm font-semibold py-2 px-3 rounded-lg hover:bg-gray-400 transition-colors"
                            >
                              削除
                            </button>
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>

            <div className="mt-6 bg-white rounded-2xl shadow-lg p-6">
              <h3 className="text-lg font-bold text-gray-800 mb-3">📋 使い方</h3>
              <ol className="space-y-2 text-sm text-gray-600">
                <li><strong>1.</strong> 右上の⚙️ボタンからDiscord Webhook URLを設定</li>
                <li><strong>2.</strong> このページのURLをQRコード化してゴミ箱に設置</li>
                <li><strong>3.</strong> 利用者がQRコードをスキャンして「満杯を報告する」をタップ</li>
                <li><strong>4.</strong> Discordに自動通知が届きます</li>
                <li><strong>5.</strong> 清掃後、「対応完了」ボタンで完了をマーク</li>
              </ol>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrashNotificationSystem />);
  </script>
</body>
</html>
